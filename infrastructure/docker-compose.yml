services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: librarian_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: librarian
      POSTGRES_PASSWORD: librarian_secret
      POSTGRES_DB: librarian_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U librarian -d librarian_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: librarian_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: librarian_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://librarian:librarian_secret@postgres:5432/librarian_db?schema=public"
      DIRECT_URL: "postgresql://librarian:librarian_secret@postgres:5432/librarian_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      AUTH_SECRET: "librarian_production_secret_32_bytes_long_random_key!"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
