services:
  - type: web
    name: librarian-web
    env: node
    plan: starter
    region: frankfurt
    buildCommand: npm install && npm run db:generate && npm run db:push -- --accept-data-loss && npm run db:seed && npm run build
    startCommand: npm run start --workspace=@librarian/web
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: librarian-postgres
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: librarian-postgres
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000

databases:
  - name: librarian-postgres
    plan: starter
    region: frankfurt
    databaseName: librarian_db
    user: librarian
